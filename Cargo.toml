[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["spikes/*", "vendor/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/cbassuarez/nus"
rust-version = "1.85"

[workspace.dependencies]
# terminal
vte = { version = "0.15", features = ["ansi"] }
bitflags = "2"
portable-pty = "0.9"
unicode-width = "0.2"
# rendering
wgpu = "30"
winit = "0.30"
raw-window-handle = "0.6"
swash = "0.2"
rustybuzz = "0.20"
fontdb = "0.24"
# browser
adblock = "0.13"
# config
mlua = { version = "0.12", features = ["luau", "vendored", "send"] }
# misc
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
rusqlite = { version = "0.40", features = ["bundled"] }
keyring = "3"
notify-rust = "4"

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
