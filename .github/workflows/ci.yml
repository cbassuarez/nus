name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwayland-dev libxkbcommon-dev libgtk-3-dev libasound2-dev libudev-dev libgbm-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace
      - name: Fetch pinned Chromium Embedded Framework
        shell: bash
        run: scripts/fetch-cef.sh
      - name: Build and test the shipping application
        shell: bash
        run: |
          source scripts/env.sh
          cargo build --locked --manifest-path spikes/composite/Cargo.toml --bins
          cargo test --locked --manifest-path spikes/composite/Cargo.toml --bin composite
