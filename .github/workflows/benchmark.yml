name: benchmarks

on:
  push:
    branches: [main, "seb/feat-**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: benchmarks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  codspeed:
    name: deterministic / codspeed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      # nus-render pulls winit/wgpu into the benchmark build even though the
      # benchmark itself never creates a GPU adapter. Match the Linux build
      # prerequisites from ci.yml, but deliberately do not fetch CEF.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwayland-dev libxkbcommon-dev \
            libgtk-3-dev libasound2-dev libudev-dev libgbm-dev

      - name: Test native harness without launching CEF
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Validate VT byte-stream correctness and fixtures
        run: cargo test --locked -p nus-vt --lib --tests

      # Execute every benchmark once, without collecting timings. Type-checking
      # alone cannot catch an invalid grid region or malformed workload.
      - name: Smoke all benchmark scenarios
        run: |
          cargo bench --locked -p nus-vt --bench terminal -- --test
          cargo bench --locked -p nus-render --bench render -- --test
          cargo bench --locked -p nus-pty --bench hold -- --test
          cargo bench --locked -p nus-sync --bench sync -- --test

      - name: Install cargo-codspeed
        run: cargo install cargo-codspeed --locked

      - name: Build deterministic benchmarks
        run: cargo codspeed build -m simulation

      - name: Run CodSpeed
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: cargo codspeed run -m simulation
