name: Profile and component compatibility
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profiles:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: cargo test --locked -p nus-compat -p nus-cli
      - run: python scripts/test-release.py
      - run: python -m unittest discover -s scripts/tests -p test_release_support.py
