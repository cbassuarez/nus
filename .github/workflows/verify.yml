name: verified invariants
on:
  pull_request:
  push:
    branches: [main, "seb/feat-**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ring:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned verification toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Fetch and verify Verus archive
        run: |
          curl --fail --location --retry 3 https://github.com/verus-lang/verus/releases/download/release/0.2026.09.20.aef82ed/verus-0.2026.09.20.aef82ed-x86-linux.zip -o /tmp/verus.zip
          echo '7b870fa12bc589015c2fab60a8b3d9f07c7b1adb3444eb0fadffcbf7f0447b33  /tmp/verus.zip' | sha256sum --check
          unzip -q /tmp/verus.zip -d /tmp/verus
      - name: Verify production source and reject broken mutation
        run: python3 scripts/verify-ring.py --verus /tmp/verus/verus-x86-linux/verus
      - name: Check ordinary production compilation and retention oracle
        run: cargo test --locked -p nus-pty --lib
      - uses: actions/upload-artifact@v4
        with:
          name: ring-proof
          path: target/verification/ring.json
