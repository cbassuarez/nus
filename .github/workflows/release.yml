name: Release
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version: v0.0.1-preview.1 or v0.0.1'
        required: true
        default: v0.0.1-preview.1
      publish:
        description: Publish the complete matrix to GitHub Releases
        type: boolean
        default: false
      platforms:
        description: 'Preview platforms (stable always requires all)'
        type: choice
        options: [all, linux, windows, macos]
        default: all

permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  # nus's GitHub sign-in (forge.rs): the app's public client ID, built in.
  # Set it under Settings › Secrets and variables › Actions › Variables.
  NUS_GITHUB_CLIENT_ID: ${{ vars.NUS_GITHUB_CLIENT_ID }}

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      matrix: ${{ steps.version.outputs.matrix }}
      targets: ${{ steps.version.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test browser media transport and rapid PiP skips
        run: |
          node scripts/check-video-transport.cjs
          node scripts/check-pip-skip.cjs
      - run: python3 scripts/test-release.py
      - run: python3 -m unittest discover -s scripts/tests -p test_release_support.py
      - id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_PLATFORMS: ${{ inputs.platforms || 'all' }}
        run: |
          python3 - <<'PY'
          import os,re,tomllib,json
          tag=os.environ['RELEASE_TAG']
          m=re.fullmatch(r'v(\d+\.\d+\.\d+)(?:-preview\.\d+)?',tag)
          if not m: raise SystemExit('Expected vX.Y.Z or vX.Y.Z-preview.N')
          root=tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version']
          app=tomllib.load(open('spikes/composite/Cargo.toml','rb'))['package']['version']
          if m[1] != root or app != root: raise SystemExit('Tag, app and workspace versions must match')
          selected=os.environ['RELEASE_PLATFORMS']
          if '-preview.' not in tag and selected!='all': raise SystemExit('Stable requires every platform')
          targets=[('macos-15','macos-arm64'),('windows-2025','windows-x86_64'),('ubuntu-22.04','linux-x86_64')]
          targets=[(runner,target) for runner,target in targets if selected=='all' or target.startswith(selected)]
          if not targets: raise SystemExit('No selected platforms')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
            out.write('tag='+tag+'\n')
            out.write('matrix='+json.dumps({'include':[{'os':runner,'target':target} for runner,target in targets]})+'\n')
            out.write('targets='+','.join(target for runner,target in targets)+'\n')
          PY
  package:
    needs: version
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
      - name: Select the MSVC linker explicitly
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $linker = Join-Path $env:VCToolsInstallDir 'bin/Hostx64/x64/link.exe'
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" >> $env:GITHUB_ENV
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 libgtk-3-dev libasound2-dev libudev-dev libgbm-dev libnss3 libxss1 libvulkan1 mesa-vulkan-drivers xvfb desktop-file-utils
      - name: Fetch pinned CEF
        run: bash scripts/fetch-cef.sh
      - name: Test and build native application
        env:
          NUS_RELEASE_VERSION: ${{ needs.version.outputs.tag }}
        run: |
          source scripts/env.sh
          cargo build --locked --release -p nus-hold
          cargo test --locked --release --workspace
          cargo build --locked --release -p nus-cli
          cargo test --locked --release --manifest-path spikes/composite/Cargo.toml --bin composite
          cargo build --locked --release --manifest-path spikes/composite/Cargo.toml --bins --lib
          if [[ "$RUNNER_OS" == macOS ]]; then
            cargo build --locked --release -p nus-render --example icon
          fi
      # Windows only stages here; sign-windows signs, verifies and packages it.
      # Keeping OIDC in that one job means these runners can never sign.
      - name: Package and sign
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_TARGET: ${{ matrix.target }}
          MACOS_CERTIFICATE: ${{ (github.event_name == 'push' || inputs.publish) && secrets.MACOS_CERTIFICATE || '' }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # With the apt repository's public key, the .deb adds that repository
          # and key, so apt keeps nus updated (docs/RELEASING.md).
          NUS_APT_PUBLIC_KEY: ${{ vars.NUS_APT_PUBLIC_KEY }}
        run: |
          if [[ "$RUNNER_OS" == Linux && -n "$NUS_APT_PUBLIC_KEY" ]]; then
            export NUS_APT_KEYRING="$RUNNER_TEMP/nus-archive-keyring.gpg"
            printf '%s\n' "$NUS_APT_PUBLIC_KEY" | gpg --dearmor > "$NUS_APT_KEYRING"
          fi
          if [[ "$RUNNER_OS" == Windows ]]; then
            python scripts/package-release.py --tag "$RELEASE_TAG" --target "$RELEASE_TARGET" --stage-only
            python scripts/stamp-windows-bootstrap.py spikes/composite/target/release/composite.exe dist/windows-stage/nus.exe
          else
            python scripts/package-release.py --tag "$RELEASE_TAG" --target "$RELEASE_TARGET"
          fi
      - name: Verify packaged executable and runtime loader
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            dist/nus.app/Contents/MacOS/nus --version
          elif [[ "$RUNNER_OS" == Windows ]]; then
            dist/windows-stage/nus.exe --version
          else
            "dist/nus-${RELEASE_TAG#v}-$RELEASE_TARGET/nus" --version
          fi
      - name: Install, launch and remove the Debian package
        if: runner.os == 'Linux'
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          deb=$(ls dist/release/*.deb)
          name=$(dpkg-deb -f "$deb" Package)
          sudo apt-get install -y "$PWD/$deb"
          nus --version | grep -F "nus ${RELEASE_TAG#v} ("
          test "$(readlink -f /usr/bin/nus)" = "/opt/$name/bin/nus"
          test -u "/opt/$name/chrome-sandbox"
          grep -q '"managed": "deb"' "/opt/$name/nus-package.json"
          desktop-file-validate /usr/share/applications/dev.nus.app*.desktop
          sudo apt-get remove -y "$name"
          test ! -e "/opt/$name" && test ! -e /usr/bin/nus
      - name: Exercise packaged browsing and native failure screens
        if: runner.os != 'Windows'
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          python -m pip install Pillow==11.3.0
          if [[ "$RUNNER_OS" == macOS ]]; then
            python scripts/check-browser.py --app dist/nus.app --out dist/browser-check
          else
            xvfb-run -a python scripts/check-browser.py --app "dist/nus-${RELEASE_TAG#v}-$RELEASE_TARGET/nus" --out dist/browser-check
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure() && runner.os != 'Windows'
        with:
          name: browser-failure-${{ matrix.target }}
          path: dist/browser-check/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: runner.os != 'Windows'
        with:
          name: release-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: runner.os == 'Windows'
        with:
          name: windows-stage
          path: dist/windows-stage/
          if-no-files-found: error
          retention-days: 1
  sign-windows:
    # The only job that can mint the OIDC token Azure Artifact Signing trusts.
    # Every Windows package from this workflow is signed, published or not; if
    # signing fails there is no Windows package.
    needs: [version, package]
    if: needs.package.result == 'success' && contains(needs.version.outputs.targets, 'windows-x86_64')
    runs-on: windows-2025
    timeout-minutes: 30
    environment:
      name: windows-signing
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-stage
          path: dist/windows-stage
      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # An exact allowlist: bundled CEF, Widevine and MSVC binaries are not ours to sign,
      # except chrome_elf.dll. A signed CEF bootstrap refuses to start unless
      # chrome_elf.dll and its client DLL carry its own certificate.
      - name: Sign nus Windows executables
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: nus-signing
          certificate-profile-name: nus-public
          files: |
            ${{ github.workspace }}\dist\windows-stage\nus.exe
            ${{ github.workspace }}\dist\windows-stage\nus.dll
            ${{ github.workspace }}\dist\windows-stage\chrome_elf.dll
            ${{ github.workspace }}\dist\windows-stage\nus-hold.exe
            ${{ github.workspace }}\dist\windows-stage\bin\nus.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify signatures and build installer
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: python scripts/package-release.py --tag "$RELEASE_TAG" --target windows-x86_64 --build-installer
      - name: Sign nus Windows installer
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: nus-signing
          certificate-profile-name: nus-public
          files-folder: ${{ github.workspace }}\dist\windows-installer
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify every signature and finalize Windows package
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: python scripts/package-release.py --tag "$RELEASE_TAG" --target windows-x86_64 --finalize-staged
      - name: Verify signed executable and runtime loader
        run: dist/windows-stage/nus.exe --version
      - name: Exercise signed browser and native failure screens
        run: |
          python -m pip install Pillow==11.3.0
          python scripts/check-browser.py --app dist/windows-stage/nus.exe --out dist/browser-check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: browser-failure-windows
          path: dist/browser-check/
      - name: Install, launch and uninstall silently
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/release/*-setup.exe | Select-Object -First 1
          $channel = if ($setup.Name -like '*-preview.*') { 'preview' } else { 'release' }
          $app = Join-Path $env:LOCALAPPDATA "Programs\nus\$channel"
          $browser = if ($channel -eq 'preview') { 'nus-preview' } else { 'nus' }
          $client = "HKCU:\Software\Clients\StartMenuInternet\$browser"
          $registered = { (Get-ItemProperty HKCU:\Software\RegisteredApplications -ErrorAction SilentlyContinue).$browser }
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=path,browser','/LOG=install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log; throw "Installer exited $($p.ExitCode)" }
          if (-not (Test-Path "$client\Capabilities\URLAssociations")) { throw 'Browser was not registered' }
          if ((& $registered) -ne "Software\Clients\StartMenuInternet\$browser\Capabilities") { throw 'Browser missing from RegisteredApplications' }
          # Installing over it is an update: a task left out now is taken back out.
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=path','/LOG=update.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content update.log; throw "Update exited $($p.ExitCode)" }
          if ((Test-Path $client) -or (& $registered)) { throw 'Update left the browser registration it was told to drop' }
          # nus.exe is a GUI program: PowerShell's `&` neither waits for it nor
          # sets $LASTEXITCODE. Wait for it and read its own exit code.
          $v = Start-Process "$app\nus.exe" -ArgumentList '--version' -Wait -PassThru -NoNewWindow -RedirectStandardOutput version.txt
          Get-Content version.txt
          if ($v.ExitCode -ne 0) { throw "Installed nus did not start its loader (exit $($v.ExitCode))" }
          $marker = Get-Content (Join-Path $env:LOCALAPPDATA "nus\installs\$channel\installed-location")
          if ($marker.TrimEnd('\') -ne $app) { throw "Installed location not recorded: $marker" }
          if (-not ((Get-ItemProperty HKCU:\Environment).Path -split ';' -contains "$app\bin")) { throw 'bin was not added to PATH' }
          $uninstall = Get-ChildItem (Join-Path $env:LOCALAPPDATA "nus\uninstall\$channel\unins*.exe") | Select-Object -First 1
          $p = Start-Process $uninstall.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Uninstaller exited $($p.ExitCode)" }
          # The uninstaller finishes from a temporary copy; give it a moment.
          for ($i = 0; $i -lt 30 -and (Test-Path $app); $i++) { Start-Sleep 1 }
          if (Test-Path $app) { throw 'Uninstall left the application folder' }
          if ((Get-ItemProperty HKCU:\Environment).Path -split ';' -contains "$app\bin") { throw 'Uninstall left bin on PATH' }
          if ((Test-Path $client) -or (Test-Path "HKCU:\Software\Classes\$browser.url") -or (& $registered)) { throw 'Uninstall left the browser registration' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-windows-x86_64
          path: dist/release/*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
  publish:
    needs: [version, package, sign-windows]
    # A preview without Windows skips sign-windows; that alone must not skip
    # publication, but a requested Windows package must have been signed.
    if: >-
      !cancelled()
      && (github.event_name == 'push' || inputs.publish)
      && needs.package.result == 'success'
      && (needs['sign-windows'].result == 'success'
          || (needs['sign-windows'].result == 'skipped' && !contains(needs.version.outputs.targets, 'windows-x86_64')))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true
      - name: Read current maintenance policy
        # An old maintenance branch must not keep claiming that it is Current.
        run: |
          git fetch --no-tags origin main
          git show FETCH_HEAD:release-support.json > dist/release/support-policy.json
      - name: Validate hashes and publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_TARGETS: ${{ needs.version.outputs.targets }}
        run: python3 scripts/publish-release.py --tag "$RELEASE_TAG" --revision "$GITHUB_SHA" --targets "$RELEASE_TARGETS" --support-policy dist/release/support-policy.json
      - name: Update the apt repository
        # A flat repository kept as the assets of the rolling release
        # apt-<channel>, where every .deb points apt (scripts/package-linux.py).
        # Its tag has no leading v, so the in-app updater never considers it.
        env:
          GH_TOKEN: ${{ github.token }}
          APT_SIGNING_KEY: ${{ secrets.NUS_APT_SIGNING_KEY }}
        run: |
          if [ -z "$APT_SIGNING_KEY" ]; then echo "NUS_APT_SIGNING_KEY not set; the apt repository is unchanged"; exit 0; fi
          if ! ls dist/release/*.deb >/dev/null 2>&1; then echo "No Linux package in this release"; exit 0; fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          key=$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          channel=$(python3 scripts/apt-repo.py --out dist/apt --key "$key" dist/release/*.deb)
          tag="apt-$channel"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease --latest=false --title "nus apt repository ($channel)" \
              --notes "The apt repository for nus's $channel channel, updated by each release. Install nus with the .deb from a release; it adds this repository."
          fi
          # The package before the index that names it; InRelease last.
          deb=$(basename dist/apt/*.deb)
          gh release upload "$tag" "dist/apt/$deb" --clobber
          gh release upload "$tag" dist/apt/*.sources dist/apt/nus-archive-keyring.gpg --clobber
          gh release upload "$tag" dist/apt/Packages dist/apt/Packages.gz dist/apt/Release dist/apt/Release.gpg --clobber
          gh release upload "$tag" dist/apt/InRelease --clobber
          gh release view "$tag" --json assets --jq '.assets[].name' | { grep '\.deb$' | grep -vxF "$deb" || true; } |
            while read -r old; do gh release delete-asset "$tag" "$old" --yes; done
      - name: Tell the site
        # nus.dev refreshes its download snapshot on this event. The token needs
        # `repo` (classic) or Contents: write on nus.dev; without it the site's
        # six-hourly schedule picks the release up instead.
        env:
          SITE_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          if [ -z "$SITE_TOKEN" ]; then echo "SITE_DISPATCH_TOKEN not set; the site will catch up on its schedule"; exit 0; fi
          curl -sS -X POST \
            -H "Authorization: Bearer $SITE_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/cbassuarez/nus.dev/dispatches \
            -d "{\"event_type\":\"release-published\",\"client_payload\":{\"tag\":\"$RELEASE_TAG\"}}"
  homebrew:
    # brew install --cask cbassuarez/nus/nus (or nus@preview). The tap is
    # github.com/cbassuarez/homebrew-nus; HOMEBREW_TAP_TOKEN may push to it.
    needs: [version, publish]
    if: needs.publish.result == 'success'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update the cask
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then echo "HOMEBREW_TAP_TOKEN not set; the tap is unchanged"; exit 0; fi
          gh release download "$RELEASE_TAG" --pattern release.json --dir "$RUNNER_TEMP"
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/cbassuarez/homebrew-nus.git" "$RUNNER_TEMP/tap"
          cask=$(python3 scripts/package-managers.py homebrew --manifest "$RUNNER_TEMP/release.json" --out "$RUNNER_TEMP/tap")
          case $cask in *.rb) ;; *) echo "$cask"; exit 0 ;; esac
          brew style "$cask"
          cd "$RUNNER_TEMP/tap"
          git add Casks
          if git diff --cached --quiet; then echo "Cask already current"; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "$(basename "$cask" .rb) ${RELEASE_TAG#v}"
          git push origin HEAD
  winget:
    # winget install cbassuarez.nus (or cbassuarez.nus.Preview). Opens a pull
    # request on microsoft/winget-pkgs from WINGET_TOKEN's fork; Microsoft's
    # validation pipeline and moderators merge it.
    needs: [version, publish]
    if: needs.publish.result == 'success'
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Submit the manifests
        env:
          GH_TOKEN: ${{ github.token }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          if (-not $env:WINGET_TOKEN) { "WINGET_TOKEN not set; nothing submitted"; exit 0 }
          gh release download $env:RELEASE_TAG --pattern release.json --dir $env:RUNNER_TEMP
          $folder = python scripts/package-managers.py winget --manifest "$env:RUNNER_TEMP/release.json" --out "$env:RUNNER_TEMP/winget"
          if (-not (Test-Path $folder)) { $folder; exit 0 }
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile "$env:RUNNER_TEMP/wingetcreate.exe"
          & "$env:RUNNER_TEMP/wingetcreate.exe" submit --prtitle "New version: nus $($env:RELEASE_TAG.TrimStart('v'))" --token $env:WINGET_TOKEN $folder
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
