name: Feature request
description: Describe something you would like to do in nus.
labels: [feature]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you want to solve. Requests help inform development; they are not a promise of implementation. This issue will be public, so leave out personal information.
  - type: input
    id: version
    attributes:
      label: App version and build
  - type: input
    id: os
    attributes:
      label: Operating system
  - type: textarea
    id: what
    attributes:
      label: What would you like to do, and how would it help?
    validations:
      required: true
  - type: textarea
    id: rule
    attributes:
      label: Alternatives you have tried
      description: Optional. Include relevant settings, rules, themes or layouts.
