name: Bug report
description: Tell us what went wrong and how to reproduce it.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve nus. This report will be public. Remove passwords, tokens, private URLs, file paths and personal details from anything you attach.
  - type: input
    id: version
    attributes:
      label: App version and build
      description: Find this in Settings → Updates. Reports opened from nus fill it in automatically.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: Add your OS version and, on Linux, Wayland or X11 if known.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: What you did
      description: What did you do just before the problem? Use a safe example where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Optional screenshots or short log excerpts. Review and redact them before posting.
