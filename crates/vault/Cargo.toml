[package]
name = "nus-vault"
description = "Authenticated local state encryption with OS-managed keys"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
chacha20poly1305 = "0.10"
getrandom = "0.4"
zeroize = "1"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }
[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[features]
# Only isolated tests may use process-local keys; never enabled in packages.
test-vault = []
