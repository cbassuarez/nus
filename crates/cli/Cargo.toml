[package]
name = "nus-cli"
description = "The nus command: drive a running nus from a shell or a script"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "nus"
path = "src/main.rs"

[dependencies]
nus-compat = { path = "../compat" }
nus-vault = { path = "../vault" }
nus-astro = { path = "../astro" }
serde_json.workspace = true
qrcode = { version = "0.14", default-features = false }
regex = "1"
ctrlc = "3"

[dev-dependencies]
tempfile = "3"
