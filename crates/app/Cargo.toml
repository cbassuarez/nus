[package]
name = "nus"
description = "nus — the terminal that is also a browser"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# `nus` on the PATH is the command (crates/cli); the app's exe is nus-app
# until the spike moves in here and the names are settled. Two `nus.exe`
# in one target dir is a link race on Windows (LNK1104).
[[bin]]
name = "nus-app"
path = "src/main.rs"

[dependencies]
nus-vt = { path = "../vt" }
nus-pty = { path = "../pty" }
nus-render = { path = "../render" }
nus-ui = { path = "../ui" }
nus-browser = { path = "../browser" }
nus-config = { path = "../config" }
winit.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
