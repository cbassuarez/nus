[package]
name = "cef-osr"
version = "0.0.0"
edition = "2024"
publish = false

# Spike 1 — see docs/SPIKES.md. Starts as a verbatim copy of
# vendor/cef-rs/examples/osr; diverges as we learn.

[features]
default = ["accelerated_osr"]
accelerated_osr = ["cef/accelerated_osr"]

[package.metadata.cef.bundle]
helper_name = "cef-osr_helper"

[dependencies]
cef = { path = "../../vendor/cef-rs/cef", default-features = false, features = ["sandbox", "build-util", "resources"] }
wgpu = "30"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing = "0.1"
pollster = "0.4"
tokio = { version = "1", features = ["full"] }
winit = "0.30"
bytemuck = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Direct3D12", "Win32_System_LibraryLoader"] }
libloading = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-metal = { version = "0.3", features = ["objc2-io-surface"] }
objc2-io-surface = "0.3.2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[workspace]
