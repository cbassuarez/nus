[package]
name = "composite"
version = "0.0.0"
edition = "2021"
publish = false

# Spike 4 — see docs/SPIKES.md. The app skeleton: nus-render compositor,
# terminal + browser panes, Broadsheet chrome, focus routing.

[package.metadata.cef.bundle]
helper_name = "composite_helper"

[dependencies]
nus-vt = { path = "../../crates/vt" }
nus-pty = { path = "../../crates/pty" }
nus-render = { path = "../../crates/render" }
nus-lsp = { path = "../../crates/lsp" }
nus-sync = { path = "../../crates/sync" }
ropey = "1.6"
cef = { path = "../../vendor/cef-rs/cef", default-features = false, features = ["sandbox", "build-util", "resources", "accelerated_osr"] }
wgpu = "30"
winit = "0.30"
anyhow = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
png = "0.17"
cpal = "0.15"
mlua = { version = "0.12", features = ["luau", "vendored"] }
tracing = "0.1"
accesskit = "0.25.0"
accesskit_winit = "0.34.0"
arboard = "3"
# Syntax: tree-sitter for the command line and code blocks. Bash and
# PowerShell ride in the binary; more grammars load from profile/grammars.
tree-sitter = "0.27"
tree-sitter-highlight = "0.27"
tree-sitter-bash = "0.25"
tree-sitter-powershell = "0.26"
# The editor's common languages ride along too.
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-json = "0.24"
tree-sitter-go = "0.25"
tree-sitter-toml-ng = "0.7"
libloading = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Wdk_System_SystemInformation"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace]

[build-dependencies]
winresource = "0.1"
