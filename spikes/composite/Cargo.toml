[package]
name = "composite"
version = "0.0.1"
rust-version = "1.89"
edition = "2021"
publish = false

# Spike 4 — see docs/SPIKES.md. The app skeleton: nus-render compositor,
# terminal + browser panes, Broadsheet chrome, focus routing.

[package.metadata.cef.bundle]
helper_name = "composite_helper"

[dependencies]
nus-compat = { path = "../../crates/compat" }
nus-vt = { path = "../../crates/vt" }
nus-pty = { path = "../../crates/pty" }
nus-render = { path = "../../crates/render" }
nus-lsp = { path = "../../crates/lsp" }
nus-sync = { path = "../../crates/sync" }
nus-vault = { path = "../../crates/vault" }
ropey = "1.6"
cef = { path = "../../vendor/cef-rs/cef", default-features = false, features = ["sandbox", "build-util", "resources", "accelerated_osr"] }
wgpu = "30"
winit = "0.30"
anyhow = "1"
serde_json = "1"
regex = "1"
semver = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
url = "2.5"
pulldown-cmark = "0.13"
csv = "1.3"
serde = { version = "1", features = ["derive"] }
png = "0.17"
# Browsing for a file: the system's own dialog on each platform, and
# whatever picture it hands back, read and squared off (pick.rs).
rfd = { version = "0.16", default-features = false, features = ["xdg-portal", "tokio"] }
tempfile = "3"
getrandom = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "ico"] }
cpal = "0.15"
mlua = { version = "0.12", features = ["luau", "vendored"] }
tracing = "0.1"
accesskit = "0.25.0"
accesskit_winit = "0.34.0"
arboard = "3"
# Syntax: tree-sitter for the command line and code blocks. Bash and
# PowerShell ride in the binary; more grammars load from profile/grammars.
tree-sitter = "0.27"
tree-sitter-highlight = "0.27"
tree-sitter-bash = "0.25"
tree-sitter-powershell = "0.26"
# The editor's common languages ride along too.
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-json = "0.24"
tree-sitter-go = "0.25"
tree-sitter-toml-ng = "0.7"
libloading = "0.8"

tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustls = { version = "0.23.45", default-features = false, features = ["std", "tls12", "ring"] }
ring = "0.17.14"
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
psl = "2"

[target.'cfg(not(windows))'.dependencies]
global-hotkey = "0.8"

[target.'cfg(unix)'.dependencies]
# Only for kill(pid, 0): whether an abandoned private root's process is gone.
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }
# logind inhibitors for Finish Work (finish_work_native.rs). Already in the tree
# through ksni with async-io; blocking-api only adds the blocking wrappers.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = { version = "0.24", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSAccessibilityProtocols", "NSAppearance", "NSButton", "NSControl", "NSEvent", "NSApplication", "NSImage", "NSGraphics", "NSScreen", "NSWindow", "NSView", "NSRunningApplication", "NSWorkspace", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSResponder", "block2"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData", "NSGeometry", "NSString", "NSURL", "NSArray"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Wdk_System_SystemInformation", "Win32_System_Power", "Win32_System_SystemInformation"] }

[workspace]

# This is a separate workspace: the root release profile does not apply here.
# Keep hot-path optimization; remove shipping debug/symbol tables instead of
# trading runtime speed for opt-level="s".
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 0
strip = "symbols"

[target.'cfg(target_os = "macos")'.dev-dependencies]
# Compile the Linux tray adapter in native unit checks as well.
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }

[build-dependencies]
winresource = "0.1"

# Backport the macOS first-drawable fix until wgpu ships PR #10302.
[patch.crates-io]
wgpu-hal = { path = "../../vendor/wgpu-hal" }

[dev-dependencies]
nus-vault = { path = "../../crates/vault", features = ["test-vault"] }
