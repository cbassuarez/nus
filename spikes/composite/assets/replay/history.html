<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>@@TITLE@@ · nus session</title>
<style>
:root{color-scheme:light dark;--paper:#f4f1ea;--ink:#141414;--dim:#716c62;--line:#d2cec4;--soft:#ebe7de;--signal:@@SIGNAL@@}
@media(prefers-color-scheme:dark){:root{--paper:#141414;--ink:#ece7da;--dim:#b2ada2;--line:#393731;--soft:#201f1c}}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:13px/1.6 "IBM Plex Mono","Cascadia Mono",Consolas,monospace;border-top:5px solid var(--signal)}button,input,select{font:inherit;color:inherit}button,select{background:var(--paper);border:1px solid var(--line);padding:7px 11px;cursor:pointer;border-radius:3px}button:hover{border-color:var(--ink);background:var(--soft)}:focus-visible{outline:2px solid var(--signal);outline-offset:3px}button:disabled{cursor:default;opacity:.5}header{max-width:1440px;margin:auto;padding:28px 32px 20px}.eyebrow{color:var(--dim);font-size:11px;letter-spacing:.14em;text-transform:uppercase}h1{font:italic 36px/1.2 Georgia,serif;margin:8px 0 12px;overflow-wrap:anywhere}p{margin:6px 0}header .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}#summary{color:var(--dim);flex:1}main{max-width:1440px;margin:auto;padding:0 32px 32px}.searchbar{display:flex;gap:12px;padding:15px 0;border-top:1px solid var(--line)}#search{width:100%;min-width:0;background:var(--paper);border:0;border-bottom:1px solid var(--ink);padding:10px 2px;font-size:15px}#results{white-space:nowrap;align-self:center;color:var(--dim)}.workspace{display:grid;grid-template-columns:minmax(250px,340px) minmax(0,1fr);border:1px solid var(--line);min-height:520px}.commands{max-height:76vh;overflow:auto;background:var(--soft)}.command{display:block;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;width:100%;padding:17px 20px;background:transparent;border-left:3px solid transparent}.command[aria-current=true]{border-left-color:var(--signal);background:var(--paper)}.command strong{display:block;font-weight:500;overflow-wrap:anywhere}.meta{display:block;color:var(--dim);font-size:11px;margin-top:7px;overflow-wrap:anywhere}.status{color:var(--dim)}.failed{font-weight:bold;color:var(--ink)}.detail{min-width:0;padding:24px;max-height:76vh;overflow:auto;border-left:1px solid var(--line)}h2{font-size:16px;line-height:1.5;font-weight:500;margin:0 0 5px;overflow-wrap:anywhere}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.primary{border-color:var(--signal)}pre{white-space:pre-wrap;overflow-wrap:anywhere;tab-size:4;font-size:13px;line-height:1.65;margin:20px 0;user-select:text}mark{background:#e7bf4670;color:inherit}.empty{padding:24px;color:var(--dim)}.still{max-width:100%;border:1px solid var(--line)}details{margin-top:24px;border:1px solid var(--line)}summary{cursor:pointer;padding:13px 18px}.player{padding:0 16px 16px}.screen{height:clamp(200px,45vw,560px);background:#141414}.screen canvas{display:block;width:100%;height:100%}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}.bar input[type=range]{min-width:100px;flex:1;accent-color:var(--signal)}.bar label{white-space:nowrap}.foot{border-top:1px solid var(--line);padding-top:16px;color:var(--dim);font-size:11px;margin-top:28px}#notice{min-height:24px;color:var(--dim)}[hidden]{display:none!important}@media(max-width:700px){header{padding:22px 18px 16px}main{padding:0 18px 20px}.workspace{display:block}.commands{max-height:260px}.detail{max-height:none;border-left:0;border-top:1px solid var(--line);padding:18px}.searchbar{flex-wrap:wrap}#results{font-size:11px}h1{font-size:30px}}@media print{.searchbar,.tools,.commands,details,header button,#notice{display:none}.workspace{display:block;border:0}.detail{max-height:none;overflow:visible;border:0}}

.workspace{grid-template-columns:minmax(0,1fr) 150px;height:72vh;min-height:400px}.commands{order:2;position:relative;overflow:hidden;max-height:none}.detail{order:1;display:flex;flex-direction:column;max-height:none;border-left:0;border-right:1px solid var(--line);overflow:hidden}.docscroll{overflow:auto;flex:1;min-height:0;position:relative;scrollbar-width:none}.docscroll::-webkit-scrollbar{display:none}.record{padding:18px 0;border-top:1px solid var(--line)}.record h3{font:inherit;font-weight:600;color:var(--signal);margin:0;overflow-wrap:anywhere}.record pre{margin:14px 0}.record.selected{border-top-color:var(--signal)}#session-map{display:block;width:100%;height:100%;touch-action:none;cursor:ns-resize}.tools{margin:12px 0}#notice{font-size:11px;min-height:20px}#command-title{font-size:14px}.foot{margin-top:20px}@media(max-width:700px){.workspace{display:grid;grid-template-columns:minmax(0,1fr) 66px;height:75vh}.commands{max-height:none}.detail{padding:12px;border-top:0}.tools{gap:4px}.tools button{font-size:11px;padding:5px}.searchbar{padding:10px 0}.record pre{font-size:12px}}
</style></head><body>
<header><div class="eyebrow">nus / session record</div><h1>@@TITLE@@</h1><div class="row"><p id="summary"></p><button id="download-text">Save transcript</button><button id="download-cast">Save recording</button></div></header>
<main><div class="searchbar"><input id="search" type="search" aria-label="Search commands, folders and output" placeholder="Search commands, folders, output…" autocomplete="off"><span id="results" role="status"></span></div>
<div class="workspace"><nav class="commands" aria-label="Session history map" id="commands"><canvas id="session-map" tabindex="0" role="slider" aria-label="Session map. Drag to browse; arrow keys step between commands" aria-valuemin="0" aria-valuenow="0"></canvas></nav><article class="detail" id="detail" aria-label="Command details"><h2 id="command-title"></h2><p class="meta" id="command-meta"></p><div class="tools"><button id="copy-command">Copy command</button><button id="copy-output">Copy output</button><button id="watch" class="primary">Play this command</button></div><div id="notice" role="status" aria-live="polite"></div><div id="output" class="docscroll" tabindex="0" aria-label="Scrollable session history"></div><figure id="page" hidden><figcaption id="page-caption" class="meta"></figcaption><img class="still" id="page-image" alt="Page captured when this command finished"></figure></article></div>
<details id="playback"><summary>Terminal playback <span class="meta">Optional · paused until you press play</span></summary><div class="player" data-hero-term><div class="screen"><canvas aria-label="Recorded terminal playback"></canvas></div><div class="bar"><button data-term-play>Play</button><input data-term-scrub type="range" min="0" step="0.01" value="0" aria-label="Playback position"><span data-term-status role="status">Ready</span><label>Speed <select id="speed" aria-label="Playback speed"><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></label><label><input id="skip-idle" type="checkbox" checked> Skip idle time</label></div></div></details>
<div class="foot">Recorded commands and output. Selecting or copying a command never runs it. This file contains the recording and any captured page images; review its contents before sharing.</div></main>
<script type="module">
@@GLUE@@
@@PLAYER@@
const decode = s => new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0)));
const CAST=decode('@@CAST@@');
const RECORDS=JSON.parse(decode('@@RECORDS@@'));
const WASM_B64='@@WASM@@';
const $=id=>document.getElementById(id);
const text=v=>typeof v==='string'?v:'';
let selected=0, visible=[], playerPromise, selecting=false;
const status=r=>r.exit===0?'Completed':Number.isInteger(r.exit)?`Exit ${r.exit}`:'Recorded';
const meta=r=>`${status(r)}${Number.isFinite(r.ms)?` · ${(r.ms/1000).toFixed(1)}s`:''}${r.cwd?` · ${r.cwd}`:''}`;
const allText=r=>[r.cmd,r.cwd,r.output,meta(r)].join('\n');
function highlighted(node,value){node.replaceChildren();const q=$('search').value.trim();if(!q){node.textContent=value;return;}const lower=value.toLowerCase(),needle=q.toLowerCase();let from=0,at;while((at=lower.indexOf(needle,from))>=0){node.append(document.createTextNode(value.slice(from,at)));const m=document.createElement('mark');m.textContent=value.slice(at,at+q.length);node.append(m);from=at+q.length;}node.append(document.createTextNode(value.slice(from)));}
function renderDetail(){const doc=$('output');doc.replaceChildren();for(const i of visible){const r=RECORDS[i],section=document.createElement('section');section.className='record';section.dataset.index=i;const h=document.createElement('h3');highlighted(h,'$ '+text(r.cmd));const m=document.createElement('p');m.className='meta';m.textContent=meta(r);const pre=document.createElement('pre');highlighted(pre,text(r.output)||'No output recorded for this command.');section.append(h,m,pre);if(r.png){const image=document.createElement('img');image.className='still';image.src='data:image/png;base64,'+r.png;image.alt='Page captured at command completion';section.append(image);}doc.append(section);}if(!visible.length){doc.textContent='No matching commands. Try a word from the command or output.';}updateSelection();requestAnimationFrame(drawMap);}
function updateSelection(){const r=RECORDS[selected];$('command-title').textContent=r?'$ '+text(r.cmd):'No matching commands';$('command-meta').textContent=r?meta(r):'';for(const el of $('output').children)el.classList.toggle('selected',+el.dataset.index===selected);for(const id of ['copy-command','copy-output','watch'])$(id).disabled=!r;}
function renderList(){const terms=$('search').value.toLowerCase().split(/\s+/).filter(Boolean);visible=RECORDS.map((r,i)=>i).filter(i=>terms.every(q=>allText(RECORDS[i]).toLowerCase().includes(q)));if(!visible.includes(selected))selected=visible[0]??-1;$('results').textContent=`${visible.length} of ${RECORDS.length} commands`;renderDetail();}
function select(i){selecting=true;selected=i;updateSelection();const section=$('output').querySelector(`[data-index="${i}"]`);if(section)$('output').scrollTop=section.offsetTop;drawMap();requestAnimationFrame(()=>{selecting=false;});}
const map=$('session-map'),doc=$('output');let dragging=null;
function drawMap(){const box=map.getBoundingClientRect(),dpr=window.devicePixelRatio||1;map.width=Math.max(1,Math.round(box.width*dpr));map.height=Math.max(1,Math.round(box.height*dpr));const ctx=map.getContext('2d');ctx.scale(dpr,dpr);const styles=getComputedStyle(document.documentElement),ink=styles.getPropertyValue('--ink'),signal=styles.getPropertyValue('--signal');const total=Math.max(doc.scrollHeight,doc.clientHeight,1),scale=box.height/total;
for(const section of doc.querySelectorAll('.record')){const i=+section.dataset.index,r=RECORDS[i],y=section.offsetTop*scale,h=section.offsetHeight*scale;ctx.fillStyle=r.exit?signal:ink;ctx.globalAlpha=r.exit ? .9 : .6;ctx.fillRect(0,y,r.exit?7:4,Math.max(2,Math.min(h,4)));const lines=['$ '+text(r.cmd),meta(r),'',...text(r.output).split('\n')];const step=Math.min(3,h/Math.max(1,lines.length));ctx.fillStyle=ink;ctx.globalAlpha=.3;for(let k=0;k<lines.length;k++){const line=lines[k];if(!line.trim())continue;const indent=line.length-line.trimStart().length;ctx.fillRect(12+Math.min(20,indent*.6),y+k*step,Math.min(box.width-22,Math.max(2,line.trim().length*.75)),Math.min(1.5,step*.7));}}
ctx.globalAlpha=.1;ctx.fillStyle=signal;const y=doc.scrollTop*scale,h=Math.max(8,doc.clientHeight*scale);ctx.fillRect(0,y,box.width,h);ctx.globalAlpha=1;ctx.strokeStyle=signal;ctx.lineWidth=1;ctx.strokeRect(.5,y+.5,box.width-1,h-1);map.setAttribute('aria-valuemax',String(Math.max(0,doc.scrollHeight-doc.clientHeight)));map.setAttribute('aria-valuenow',String(Math.round(doc.scrollTop)));map.setAttribute('aria-valuetext',RECORDS[selected]?text(RECORDS[selected].cmd):'No commands');}
function nearest(scroll){return [...doc.querySelectorAll('.record')].reduce((best,el)=>!best||Math.abs(el.offsetTop-scroll)<Math.abs(best.offsetTop-scroll)?el:best,null);}
map.addEventListener('pointerdown',e=>{e.preventDefault();map.focus();map.setPointerCapture(e.pointerId);const box=map.getBoundingClientRect(),scale=box.height/Math.max(1,doc.scrollHeight),y=e.clientY-box.top,top=doc.scrollTop*scale,h=doc.clientHeight*scale;if(y>=top&&y<=top+h){dragging=y-top;}else{const el=nearest(y/scale);if(el)select(+el.dataset.index);dragging=0;}});
map.addEventListener('pointermove',e=>{const box=map.getBoundingClientRect(),scale=box.height/Math.max(1,doc.scrollHeight);if(dragging!==null){doc.scrollTop=(e.clientY-box.top-dragging)/scale;drawMap();}else{const el=nearest((e.clientY-box.top)/scale);map.title=el?text(RECORDS[+el.dataset.index].cmd)+' · '+meta(RECORDS[+el.dataset.index]):'';}});
function release(){dragging=null;const el=nearest(doc.scrollTop);if(el&&Math.abs(el.offsetTop-doc.scrollTop)<14)doc.scrollTop=el.offsetTop;drawMap();}
map.addEventListener('pointerup',release);map.addEventListener('pointercancel',()=>{dragging=null;});
map.addEventListener('wheel',e=>{e.preventDefault();doc.scrollTop+=e.deltaY*(e.deltaMode===1?20:1);},{passive:false});
map.addEventListener('keydown',e=>{const i=visible.indexOf(selected);let next;if(e.key==='ArrowDown')next=Math.min(i+1,visible.length-1);if(e.key==='ArrowUp')next=Math.max(i-1,0);if(e.key==='Home')next=0;if(e.key==='End')next=visible.length-1;if(next!==undefined&&visible.length){e.preventDefault();select(visible[next]);}if(e.key==='PageDown'||e.key==='PageUp'){e.preventDefault();doc.scrollTop+=(e.key==='PageDown'?1:-1)*doc.clientHeight*.8;}});
doc.addEventListener('scroll',()=>{if(selecting){drawMap();return;}const sections=[...doc.querySelectorAll('.record')];const section=sections.filter(el=>el.offsetTop<=doc.scrollTop+24).at(-1)||sections[0];if(section&&selected!==+section.dataset.index){selected=+section.dataset.index;updateSelection();}drawMap();});
new ResizeObserver(drawMap).observe(doc);new ResizeObserver(drawMap).observe(map.parentElement);
$('search').addEventListener('input',renderList);
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='f'){e.preventDefault();$('search').focus();}if(e.key==='Escape'&&document.activeElement===$('search')){$('search').value='';renderList();}});
async function copy(value){try{await navigator.clipboard.writeText(value);$('notice').textContent='Copied';}catch{const input=document.createElement('textarea');input.value=value;document.body.append(input);input.select();const ok=document.execCommand('copy');input.remove();$('notice').textContent=ok?'Copied':'Copy unavailable. Select the text and use your system copy shortcut.';}}
$('copy-command').onclick=()=>copy(text(RECORDS[selected]?.cmd));$('copy-output').onclick=()=>copy(text(RECORDS[selected]?.output));
function download(value,name,type){const url=URL.createObjectURL(new Blob([value],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);}
$('download-text').onclick=()=>download(RECORDS.map(r=>`$ ${text(r.cmd)}\n${meta(r)}\n\n${text(r.output)}`).join('\n\n────────\n\n'),'nus-session.txt','text/plain;charset=utf-8');
$('download-cast').onclick=()=>download(CAST,'nus-session.cast','application/x-asciicast');
async function player(){if(!playerPromise)playerPromise=mountHeroTerminal(document.querySelector('[data-hero-term]'),{wasm:Uint8Array.from(atob(WASM_B64),c=>c.charCodeAt(0)),castText:CAST,autoplay:false,loop:false}).then(t=>{t.speed=+$('speed').value;t.skipIdle=$('skip-idle').checked;return t;}).catch(e=>{document.querySelector('[data-term-status]').textContent='Playback unavailable; the transcript is still readable.';throw e;});return playerPromise;}
$('playback').addEventListener('toggle',async()=>{if($('playback').open){try{const t=await player();t.layout();}catch{}}else if(playerPromise){try{const t=await playerPromise;t.userPaused=true;t.pause();}catch{}}});
$('watch').onclick=async()=>{const r=RECORDS[selected];if(!r)return;$('playback').open=true;try{const t=await player();t.pause();t.seek(Number(r.start)||0);t.layout();t.userPaused=false;t.play();$('playback').scrollIntoView({block:'nearest'});}catch{}};
$('speed').onchange=async()=>{try{(await player()).speed=+$('speed').value;}catch{}};
$('skip-idle').onchange=async()=>{try{(await player()).skipIdle=$('skip-idle').checked;}catch{}};
const failed=RECORDS.filter(r=>Number.isInteger(r.exit)&&r.exit!==0).length;
$('summary').textContent=`${RECORDS.length} commands${failed?` · ${failed} with a nonzero exit`:''} · Search, inspect, copy, or play back`;
renderList();
</script></body></html>
